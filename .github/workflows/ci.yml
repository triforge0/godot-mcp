name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./...
      - run: go build -o bin/godot-mcp ./cmd/godot-mcp

  build-matrix:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o bin/godot-mcp${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/godot-mcp

  integration-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y xvfb unzip curl
      - name: Install Godot 4.3
        run: bash scripts/install-godot.sh
      - name: Integration tests (real Godot editor + MCP)
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: go test -tags=integration -timeout 10m -v ./internal/integration/...
